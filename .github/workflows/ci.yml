# CI for Droid Bar: syntax, lint, tests, build and a -Preview smoke run.
#
# Targets the app's real runtime (Windows PowerShell 5.1 / .NET Framework 4) where
# platform-dependent; the Pester suite runs under pwsh because the lib module is
# GUI-free and cross-host testable (see AGENTS.md "Windows-only caveats").

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      # PS 5.1 syntax gate: the tray app must parse on the Windows PowerShell 5.1
      # host, not just on pwsh (guards against PS 7-only syntax per AGENTS.md).
      - name: AST parse gate (PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($p in 'droid-bar.ps1', 'src/droid-bar-lib.psm1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $failed = $true
              Write-Host "$p : $($errs.Count) parse error(s)"
              foreach ($e in $errs) { Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)" }
            } else {
              Write-Host "$p : parse clean"
            }
          }
          if ($failed) { exit 1 }

      - name: Lint (PSScriptAnalyzer, repo settings)
        shell: pwsh
        run: |
          if (!(Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $findings = @()
          foreach ($p in 'droid-bar.ps1', 'src/droid-bar-lib.psm1') {
            $findings += Invoke-ScriptAnalyzer -Path $p -Settings PSScriptAnalyzerSettings.psd1
          }
          $findings | Format-Table -AutoSize | Out-String -Width 200
          $errors = @($findings | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Host "::error::$($errors.Count) Error-severity finding(s)"
            exit 1
          }

      - name: Install Pester 5.7.1 (pinned, per AGENTS.md)
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser

      - name: Pester tests
        shell: pwsh
        run: Import-Module Pester -RequiredVersion 5.7.1; Invoke-Pester -Path tests -Output Detailed -CI

      # Compiles DroidBar.exe with the .NET Framework 4 csc.exe (Windows only).
      - name: Build DroidBar.exe
        shell: powershell
        run: .\build.ps1

      # Headless validation protocol (AGENTS.md): render the popup + tray icon
      # from mock data into PNGs; uploaded as artifacts below.
      - name: Smoke preview (mock data)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File droid-bar.ps1 -Mock samples\mock.json -Preview out.png

      # -PreviewTab renders one tab's content (see AGENTS.md protocol): the
      # Computer tab proves the third-tab layout and the content-aware height.
      - name: Smoke preview (Computer tab)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File droid-bar.ps1 -Mock samples\mock.json -Preview out-computer.png -PreviewTab computer

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-pngs
          path: |
            out.png
            out-icon.png
            out-computer.png
          if-no-files-found: error
