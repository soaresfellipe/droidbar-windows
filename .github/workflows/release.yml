# Release for Droid Bar: tag -> build -> zip -> GitHub Release.
#
# Trigger: a semver tag (vMAJOR.MINOR.PATCH) pushed to the repository, as
# documented in AGENTS.md "Release steps". The build runs on windows-latest
# because build.ps1 compiles DroidBar.exe with the .NET Framework 4 csc.exe.
#
# The zip layout is the installed layout: DroidBar.exe, droid-bar.ps1,
# src/droid-bar-lib.psm1 (imported by the script at runtime), README.md and
# LICENSE. Nothing else ships.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Compiles DroidBar.exe with the C# compiler that ships with Windows
      # (.NET Framework 4). Windows-only, same call as the CI build step.
      - name: Build DroidBar.exe
        shell: powershell
        run: .\build.ps1

      # Stage into a temp dir so the zip has exactly the shipped layout and no
      # CI leftovers; then print the entry list so the run log is the evidence
      # for the asset contents.
      - name: Package release zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag  = $env:GITHUB_REF_NAME
          $root = $env:GITHUB_WORKSPACE
          $pkg  = Join-Path $env:RUNNER_TEMP 'droid-bar-package'
          $zip  = Join-Path $root "DroidBar-$tag.zip"

          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pkg 'src') -Force | Out-Null

          Copy-Item (Join-Path $root 'DroidBar.exe')            $pkg
          Copy-Item (Join-Path $root 'droid-bar.ps1')           $pkg
          Copy-Item (Join-Path $root 'src\droid-bar-lib.psm1')  (Join-Path $pkg 'src')
          Copy-Item (Join-Path $root 'README.md')               $pkg
          Copy-Item (Join-Path $root 'LICENSE')                 $pkg

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($pkg, $zip)
          Write-Host "packed $zip"
          foreach ($e in [System.IO.Compression.ZipFile]::OpenRead($zip).Entries) {
            Write-Host "  $($e.FullName) ($($e.Length) bytes)"
          }

      # Auto-generated release notes (previous tag..current tag) plus the zip.
      # gh is preinstalled on the GitHub runners and uses GITHUB_TOKEN, which
      # the `contents: write` permission above grants to this job.
      - name: Publish GitHub Release
        shell: cmd
        run: >
          gh release create "%GITHUB_REF_NAME%"
          "DroidBar-%GITHUB_REF_NAME%.zip"
          --repo "%GITHUB_REPOSITORY%"
          --title "%GITHUB_REF_NAME%"
          --generate-notes
          --verify-tag

      - name: Summary
        shell: bash
        run: echo "Release $GITHUB_REF_NAME published from $GITHUB_SHA"
