# Dependency update automation.
#
# There is no lockfile-driven ecosystem here (the app ships no runtime
# dependencies), but the supply chain still has moving parts: the third-party
# GitHub Actions the workflows run, and the two PowerShell modules the gates
# install (PSScriptAnalyzer, Pester).
#
# `min_release_age_days` is the delay gate: an update is not even proposed until
# the upstream release has been out for 7 days, so a compromised or broken
# release cannot be pulled into a green build the day it publishes. The Pester
# pin in AGENTS.md / CI is 5.7.1; dependabot proposes bumps, a human merges.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    min_release_age_days: 7
    labels:
      - type/chore
      - area/ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: powershell
    directory: /
    schedule:
      interval: weekly
      day: monday
    min_release_age_days: 7
    labels:
      - type/chore
      - area/ci
    groups:
      powershell-modules:
        patterns:
          - '*'
